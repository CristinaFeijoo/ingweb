<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTPL</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .header {
            background-color: #004A7C;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .menu {
            width: 200px;
            background-color: #E0E0E0;
            padding: 20px;
        }
        .menu h2 {
            font-size: 18px;
            margin: 0;
        }
e        .content {
            flex: 1;
            background-color: white;
            padding: 20px;
        }
        .footer {
            background-color: #004A7C;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>UTPL</h1>
        <h1>Universidad Técnica Particular de Loja</h1>
    </div>

    <div class="container">
        <div class="menu">
            <h2>Menu</h2>
        </div>

        <div class="content"></div>
    </div>

    <div class="footer"></div>

</body>
</html>
